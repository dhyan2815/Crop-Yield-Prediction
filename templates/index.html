<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css">
    <title>Crop Yield Prediction</title>
  </head>
  <body>
    <form action="/predict" method="POST">
      <label for="crop">Crop:</label>
      <select name="crop">
        <option value="Rice">Rice</option>
        <option value="Wheat">Wheat</option>
        <!-- Add more -->
      </select>

      <label for="year">Year:</label>
      <input type="number" name="year" value="{{ current_year }}" readonly />

      <label for="pesticide">Pesticide Use (tonnes):</label>
      <input type="number" name="pesticide" step="0.01" required />

      <!-- These will be set via JS using browser's geolocation -->
      <input type="hidden" name="lat" id="lat" />
      <input type="hidden" name="lon" id="lon" />

      <button type="submit">Predict Yield</button>
    </form>

    {% if prediction_lr %}
    <h2>Predicted Yield</h2>
    <p>Linear Regression: {{ prediction_lr }} kg/ha</p>
    <p>Random Forest: {{ prediction_rf }} kg/ha</p>

    <h3>Backend Data</h3>
    <ul>
      <li>Rainfall: {{ rainfall }} mm</li>
      <li>Temperature: {{ temperature }}°C</li>
    </ul>

    <!-- Matplotlib graphs here -->
    <img src="{{ url_for('static', filename='yield_plot.png') }}" />
    {% endif %}

    <script>
      navigator.geolocation.getCurrentPosition(function (position) {
        document.getElementById("lat").value = position.coords.latitude;
        document.getElementById("lon").value = position.coords.longitude;
      });
    </script>
  </body>
</html>
